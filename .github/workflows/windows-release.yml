name: Windows Release

# Every release tag gets the Windows packages, added to that version's GitHub
# release: one version, one release, both systems. The Mac's release.sh makes
# the tag and, usually first, the release; a version that ships on Windows
# alone gets its release made here.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # A version listed in windows/mac-only.txt gets no Windows packages.
  ships:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.listed.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - id: listed
        run: |
          if grep -qxF "${GITHUB_REF_NAME#v}" windows/mac-only.txt; then
            echo "$GITHUB_REF_NAME ships on the Mac alone"; echo "windows=false" >> "$GITHUB_OUTPUT"
          else
            echo "windows=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: ships
    if: needs.ships.outputs.windows == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$v" = "$(tr -d '[:space:]' < VERSION)" ] || { echo "tag $GITHUB_REF_NAME does not match VERSION"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          notes="windows/release-notes/$v.md"
          [ -f "$notes" ] || { echo "$notes is missing"; exit 1; }
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test windows/ClaudeGraft.Tests -nologo

      - name: Restore dependencies
        run: dotnet restore windows/ClaudeGraft/ClaudeGraft.csproj -r win-x64

      - name: Publish
        run: >
          dotnet publish windows/ClaudeGraft/ClaudeGraft.csproj
          -c Release
          -p:Platform=x64
          -p:GraftVersion=${{ steps.version.outputs.version }}
          -o windows/dist/ClaudeGraft
          --no-restore

      # A framework-dependent exe beside the launcher's bundled runtime will not
      # start at all, so a build that lost self-contained must not ship.
      - name: Check both executables carry their runtime
        shell: pwsh
        run: |
          foreach ($name in 'ClaudeGraft', 'GraftLaunch') {
            $config = Get-Content "windows/dist/ClaudeGraft/$name.runtimeconfig.json" -Raw
            if ($config -notmatch 'includedFrameworks') { throw "$name was published framework-dependent" }
          }

      # Sidebar sync skips silently without it, so a release missing it looks fine.
      # The version is pinned in windows/electron-version.txt: "latest" made each
      # release ship whatever Electron was newest that day, untried with the helper.
      - name: Stage bundled Electron
        shell: pwsh
        run: |
          ./windows/fetch-electron.ps1
          # Without it electron.exe exits 1 on the helper's folder, and every sync fails.
          if (-not (Test-Path windows/dist/ClaudeGraft/electron/resources/default_app.asar)) {
            throw "Electron was staged without default_app.asar"
          }

      - name: Install vpk
        # The same version as the Velopack package ClaudeGraft.csproj references.
        run: dotnet tool install -g vpk --version 1.2.161

      # A delta is made against the last Windows release's package; the first has none to fetch.
      - name: Fetch the previous release
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          -o windows/dist/velopack

      # Installer only: a portable copy cannot update itself, and Graft is
      # meant to stay current.
      - name: Pack
        run: >
          vpk pack
          --packId ClaudeGraftApp
          --packVersion ${{ steps.version.outputs.version }}
          --packDir windows/dist/ClaudeGraft
          --mainExe ClaudeGraft.exe
          --packTitle "Claude Graft"
          --packAuthors "Claude Graft"
          --icon windows/ClaudeGraft/Assets/AppIcon.ico
          --releaseNotes ${{ steps.version.outputs.notes }}
          --shortcuts StartMenuRoot
          --framework vcredist143-x64
          --noPortable
          -o windows/dist/velopack

      # Added to the release the Mac made if there is one, leaving its title
      # and notes alone; made here, with the Windows notes, if not. Made as a
      # draft: a published release takes no more files, so a prerelease made
      # here would refuse the Mac's. release.sh says how it goes on from there.
      - name: Publish to the version's release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          files=(windows/dist/velopack/ClaudeGraftApp-win-Setup.exe
                 windows/dist/velopack/ClaudeGraftApp-$v-*.nupkg
                 windows/dist/velopack/releases.win.json)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag \
              --title "Claude Graft $v" --notes-file "${{ steps.version.outputs.notes }}" --draft
          fi
