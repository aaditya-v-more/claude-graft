name: Windows
on:
  push:
    branches: [main, 'temp/**']
    paths: ['windows/**', 'VERSION', 'Resources/Info.plist', 'Sources/Shared/SidebarStorage.swift', 'Tests/Sidebar/main.swift', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'VERSION', 'Resources/Info.plist', 'Sources/Shared/SidebarStorage.swift', 'Tests/Sidebar/main.swift', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - architecture: x64
            runner: windows-2025-vs2026
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and package
        shell: pwsh
        run: ./windows/build.ps1 -Architecture ${{ matrix.architecture }}
      - name: Build setup
        shell: pwsh
        run: ./windows/build-installer.ps1 -Architecture ${{ matrix.architecture }} -SkipBuild
      - name: Sync pins and order in disposable Chromium profiles
        shell: pwsh
        run: ./windows/test-sidebar.ps1 -Runtime ./windows/dist/ClaudeGraft-${{ matrix.architecture }}/launcher/sidebar-runtime
      - name: Verify per-user install and uninstall
        shell: pwsh
        run: |
          ./windows/build-installer.ps1 -Architecture ${{ matrix.architecture }} -SkipBuild -TestMode
          $installer = Get-Item windows/dist/*-setup-test.exe
          ./windows/test-installer.ps1 -Installer $installer.FullName -SkipUi
      - name: Verify production protocol registration on the disposable runner
        shell: pwsh
        run: |
          $installer = Get-Item windows/dist/*-setup.exe
          ./windows/test-hosted-registration.ps1 -Installer $installer.FullName
      - name: Keep the Windows build for review
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeGraft-windows-${{ matrix.architecture }}
          path: |
            windows/dist/*.zip
            windows/dist/*-setup.exe
            windows/dist/*-setup.exe.build.json
            windows/dist/*.zip.sha256
            windows/dist/*-setup.exe.sha256
