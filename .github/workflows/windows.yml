name: Windows
on:
  push:
    branches: [main, 'temp/**']
    paths: ['windows/**', 'VERSION', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'VERSION', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        architecture: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and package
        shell: pwsh
        run: ./windows/build.ps1 -Architecture ${{ matrix.architecture }}
      - name: Keep the Windows build for review
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeGraft-windows-${{ matrix.architecture }}
          path: |
            windows/dist/*.zip
            windows/dist/*.sha256
