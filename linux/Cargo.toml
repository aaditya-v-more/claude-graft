[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
graft-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
